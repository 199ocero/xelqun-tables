<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Xelqun Tables: a PHP column definition rendered as a table">
  <defs>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0" stop-color="#414fd2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#414fd2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f4f5f8" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="812" x2="866" y1="200" y2="200">
      <stop offset="0" stop-color="#778ffa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#778ffa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#0e0f13"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="68" y="172" fill="#f4f5f8" font-size="56" font-weight="700" letter-spacing="-1.5">Xelqun</text>
    <text x="68" y="232" fill="#778ffa" font-size="56" font-weight="700" letter-spacing="-1.5">Tables</text>
    <text x="70" y="276" fill="#aeb3c2" font-size="20">Write it in PHP. Render it in Vue.</text>
  </g>

  <!-- PHP definition -->
  <g filter="url(#shadow)">
    <rect x="432" y="104" width="372" height="192" rx="14" fill="#171922" stroke="#2b2f3d"/>
  </g>
  <g fill="#3a3f50">
    <circle cx="456" cy="128" r="5"/>
    <circle cx="474" cy="128" r="5"/>
    <circle cx="492" cy="128" r="5"/>
  </g>
  <text x="780" y="133" text-anchor="end" fill="#7d8396" font-family="Menlo, Monaco, monospace" font-size="13">ProductsTable.php</text>
  <g font-family="Menlo, Monaco, monospace" font-size="19">
    <text x="456" y="182"><tspan fill="#778ffa">TextColumn</tspan><tspan fill="#aeb3c2">::</tspan><tspan fill="#f4f5f8">make</tspan><tspan fill="#aeb3c2">(</tspan><tspan fill="#8fd6b4">'status'</tspan><tspan fill="#aeb3c2">)</tspan></text>
    <text x="484" y="216"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">badge</tspan><tspan fill="#aeb3c2">()</tspan></text>
    <text x="484" y="250"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">sortable</tspan><tspan fill="#aeb3c2">(),</tspan></text>
  </g>

  <!-- Flow from definition to rendered table -->
  <path d="M812 200 H862" fill="none" stroke="url(#link)" stroke-width="3" stroke-linecap="round"/>
  <path d="M858 191 L868 200 L858 209" fill="none" stroke="#778ffa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rendered table -->
  <g filter="url(#shadow)">
    <rect x="880" y="88" width="332" height="224" rx="14" fill="#f4f5f8"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <path d="M880 102 a14 14 0 0 1 14 -14 H1198 a14 14 0 0 1 14 14 V136 H880 Z" fill="#e7e9f0"/>
    <text x="904" y="118" fill="#5b6072" font-size="15" font-weight="600">Name</text>
    <text x="1016" y="118" fill="#1a1b23" font-size="15" font-weight="600">Status</text>
    <path d="M1072 119 V108 M1067 113 L1072 108 L1077 113" fill="none" stroke="#414fd2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1188" y="118" text-anchor="end" fill="#5b6072" font-size="15" font-weight="600">Price</text>

    <text x="904" y="170" fill="#1a1b23" font-size="16">Keyboard</text>
    <rect x="1016" y="152" width="62" height="24" rx="12" fill="#d7efe3"/>
    <text x="1047" y="169" text-anchor="middle" fill="#177a50" font-size="13" font-weight="600">active</text>
    <text x="1188" y="170" text-anchor="end" fill="#1a1b23" font-size="16">$120.00</text>
    <rect x="880" y="194" width="332" height="1" fill="#dcdfe8"/>

    <text x="904" y="228" fill="#1a1b23" font-size="16">Monitor</text>
    <rect x="1016" y="210" width="62" height="24" rx="12" fill="#d7efe3"/>
    <text x="1047" y="227" text-anchor="middle" fill="#177a50" font-size="13" font-weight="600">active</text>
    <text x="1188" y="228" text-anchor="end" fill="#1a1b23" font-size="16">$340.00</text>
    <rect x="880" y="252" width="332" height="1" fill="#dcdfe8"/>

    <text x="904" y="286" fill="#1a1b23" font-size="16">Mouse</text>
    <rect x="1016" y="268" width="52" height="24" rx="12" fill="#f7ead0"/>
    <text x="1042" y="285" text-anchor="middle" fill="#9a6206" font-size="13" font-weight="600">draft</text>
    <text x="1188" y="286" text-anchor="end" fill="#1a1b23" font-size="16">$45.00</text>
  </g>
</svg>
